<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShmilApps | סקר שוק לדוגמה</title><style>
*{box-sizing:border-box}body{margin:0;background:#050906;color:#f2f4ef;font-family:Arial,sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 50% 52%,#18351b70,transparent 65%)}header{padding:19px 5%;border-bottom:1px solid #22301e;display:flex;align-items:center;justify-content:space-between}header b{font-size:20px}header b:before{content:'';display:inline-block;width:8px;height:8px;background:#b4f500;border-radius:50%;margin-right:8px;box-shadow:0 0 15px #b4f500}.languages{display:flex;gap:6px;direction:ltr}.languages a{color:#a7b49f;text-decoration:none;font-size:12px;padding:7px 12px;border:1px solid #33412c;border-radius:20px}.languages a[aria-current=page]{background:#b1e744;color:#17200c;border-color:#b1e744}.intro{text-align:center;padding:28px 20px 8px;margin:auto;max-width:700px}.eyebrow{color:#b8e774;font-size:12px;letter-spacing:1px}h1{font-size:clamp(25px,4vw,36px);margin:11px 0}.intro p{line-height:1.7;font-size:14px;color:#a7b49e;margin:8px 0}.stage{direction:ltr;display:flex;justify-content:center;align-items:center;padding:12px 18px;margin:15px auto 0;max-width:840px;overflow:hidden;min-height:560px}.frame{width:min(94%,684px);filter:drop-shadow(0 20px 25px #0009)}.frame.rtl{transform:scaleX(-1)}.book{touch-action:pan-y;cursor:pointer;outline-offset:6px}.page{background:white;overflow:hidden}.sheet{height:100%;width:100%;position:relative;user-select:none}.sheet img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.rtl .sheet{transform:scaleX(-1)}.status{text-align:center;color:#b5c6aa;font-size:12px;margin:12px 0}.hint{text-align:center;color:#8d9d84;font-size:12px;padding:0 20px;line-height:1.8;margin:8px 0 30px}.note{text-align:center;max-width:600px;margin:0 auto 30px;color:#6e7e66;font-size:11px;line-height:1.7;padding:0 24px}
@media(min-width:620px){.frame.rtl.front{transform:translateX(171px) scaleX(-1)}.frame.rtl.back{transform:translateX(-171px) scaleX(-1)}.frame.ltr.front{transform:translateX(-171px)}.frame.ltr.back{transform:translateX(171px)}}@media(max-width:619px){header{padding:15px 20px}.intro{padding-top:24px}.intro p{font-size:13px}.stage{padding:7px 12px;margin-top:10px;min-height:390px}.hint{font-size:11px}.note{font-size:10px}}
header,.intro,.note{display:none}html{overflow:hidden}html,body{min-height:0;height:auto;background:#050906;background-image:none}body{display:flow-root;width:100%}.stage{min-height:0;margin:0 auto;padding-top:8px;padding-bottom:8px}.hint{margin-bottom:12px}.status{margin-top:8px}.frame{filter:drop-shadow(0 10px 14px #0008)}</style></head><body><header><b dir="ltr">ShmilApps</b><nav class="languages" aria-label="Language"><a href="?lang=he" lang="he">עברית</a><a href="?lang=en" lang="en">English</a></nav></header><main><section class="intro"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p></section><section class="stage" id="stage"><div class="frame" id="frame"><div class="book" id="book" tabindex="0" role="group"></div></div></section><p class="status" id="status" aria-live="polite"></p><p class="hint" id="hint"></p><p class="note" id="note"></p></main><script src="assets/page-flip.js"></script><script>
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'he',rtl=lang==='he';document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.title=rtl?'ShmilApps | טעם של בית - סקר שוק לדוגמה':'ShmilApps | A Taste of Home - Sample Market Research';
document.querySelector('[href="?lang='+lang+'"]').setAttribute('aria-current','page');
const words=rtl?{eyebrow:'עבודה לדוגמה • סקרי שוק',title:'טעם של בית',description:'סקר שוק בישראל ובחו״ל לספרי מתכונים אישיים וזיכרונות משפחתיים.',hint:'לחצו על הכריכה לפתיחה. לחיצה בצד שמאל מקדמת, ובצד ימין חוזרת. במובייל אפשר גם להחליק.',note:'דוגמה נפרדת מהאתר. 27 עמודי הדוח המלא, כולל הכריכה, ועמוד סיום. כל עמוד מוצג כתמונה.',label:'ספר סקר שוק בעברית. לחצו לפתיחה או לדפדוף.'}:{eyebrow:'SAMPLE WORK • MARKET RESEARCH',title:'A Taste of Home',description:'Israeli and international market research for personalized cookbooks and family memories.',hint:'Click the cover to open. Click the right side to turn forward, or the left side to go back. You can also swipe on mobile.',note:'A separate website demo. All 27 report pages, including the cover, plus an end page. Every page is displayed as an image.',label:'English market research book. Click to open or turn pages.'};
for(const id of ['eyebrow','title','description','hint','note'])document.getElementById(id).textContent=words[id];
const book=document.getElementById('book'),frame=document.getElementById('frame'),status=document.getElementById('status');book.setAttribute('aria-label',words.label);frame.classList.add(rtl?'rtl':'ltr');
for(let i=1;i<=28;i++){const article=document.createElement('article');article.className='page';if(i===1||i===28)article.dataset.density='hard';const sheet=document.createElement('div');sheet.className='sheet';const image=new Image();image.src='assets/taam-'+lang+'/'+String(i).padStart(2,'0')+'.webp';image.alt=rtl?(i===28?'סוף':'עמוד '+i+' מתוך הדוח המקורי'):(i===28?'The End':'Report page '+i);image.draggable=false;sheet.append(image);article.append(sheet);book.append(article)}
const flip=new St.PageFlip(book,{width:342,height:483.84,size:'stretch',minWidth:200,maxWidth:342,minHeight:283,maxHeight:484,showCover:true,usePortrait:true,autoSize:true,drawShadow:true,maxShadowOpacity:.28,flippingTime:matchMedia('(prefers-reduced-motion: reduce)').matches?1:700,useMouseEvents:false,mobileScrollSupport:true});flip.loadFromHTML(document.querySelectorAll('.page'));
function update(){const n=flip.getCurrentPageIndex();frame.classList.toggle('front',n===0);frame.classList.toggle('back',n===27);status.textContent=n===0?(rtl?'כריכה קדמית':'Front cover'):n===27?(rtl?'סוף':'The End'):(rtl?'עמוד '+(n+1)+' מתוך 27':'Page '+(n+1)+' of 27')}
flip.on('flip',update);update();let start;
book.addEventListener('pointerdown',e=>start={x:e.clientX,y:e.clientY});book.addEventListener('pointercancel',()=>start=null);book.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dy)>Math.max(25,Math.abs(dx)))return;if(Math.abs(dx)>30){if((rtl&&dx>0)||(!rtl&&dx<0))flip.flipNext();else flip.flipPrev();return}const n=flip.getCurrentPageIndex();if(n===0){flip.flipNext();return}if(n===27){flip.flipPrev();return}const r=book.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;if((rtl&&left)||(!rtl&&!left))flip.flipNext();else flip.flipPrev()});
book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();flip.flipNext()}if(e.key==='ArrowLeft'){e.preventDefault();flip.flipPrev()}if(e.key==='Home'){e.preventDefault();flip.turnToPage(0);update()}if(e.key==='End'){e.preventDefault();flip.turnToPage(27);update()}if(e.key==='Enter'||e.key===' '){e.preventDefault();if(flip.getCurrentPageIndex()===27)flip.flipPrev();else flip.flipNext()}});window.demoBook=flip;
</script><script>
function reportHeight(){parent.postMessage({type:'shmilapps-market-book-height',height:Math.ceil(document.body.getBoundingClientRect().height)+2},location.origin)}
new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.body);addEventListener('load',reportHeight);window.demoBook.on('flip',reportHeight);
</script></body></html>
