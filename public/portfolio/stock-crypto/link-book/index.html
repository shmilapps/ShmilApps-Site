<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShmilApps | LINK Research</title><style>
*{box-sizing:border-box}html{overflow:hidden}html,body{margin:0;min-height:0;height:auto;background:#050906;color:#f2f4ef;font-family:Arial,sans-serif}body{display:flow-root;width:100%}.stage{direction:ltr;display:flex;justify-content:center;align-items:center;max-width:880px;padding:8px 18px;margin:0 auto;overflow:hidden}.frame{width:min(100%,840px);filter:drop-shadow(0 10px 14px #0008)}.frame.rtl{transform:scaleX(-1)}.frame.rtl.front{transform:translateX(var(--cover-shift,210px)) scaleX(-1)}.frame.ltr.front{transform:translateX(calc(-1 * var(--cover-shift,210px)))}.book{touch-action:pan-y;cursor:pointer;outline-offset:6px}.book:focus-visible{outline:2px solid #baff00}.page{background:#050706;overflow:hidden}.sheet{width:100%;height:100%;position:relative;user-select:none}.sheet img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.rtl .sheet{transform:scaleX(-1)}.status{text-align:center;color:#b5c6aa;font-size:12px;margin:8px 0 12px}.hint{text-align:center;color:#8d9d84;font-size:12px;padding:0 20px;line-height:1.8;margin:8px 0 12px}@media(max-width:619px){.stage{padding:8px 12px}.hint{font-size:11px}}
</style></head><body><main><section class="stage"><div class="frame" id="frame"><div class="book" id="book" tabindex="0" role="group"></div></div></section><p class="status" id="status" aria-live="polite"></p><p class="hint" id="hint"></p></main><script src="/portfolio/market-research/book/assets/page-flip.js"></script><script>
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'he',rtl=lang==='he',reportPages=20,pageCount=21;document.documentElement.lang=lang;document.documentElement.dir=rtl?'rtl':'ltr';document.title=rtl?'ShmilApps | סקירת Chainlink ו־LINK':'ShmilApps | Chainlink and LINK Research';
const book=document.getElementById('book'),frame=document.getElementById('frame'),status=document.getElementById('status');frame.classList.add(rtl?'rtl':'ltr');book.setAttribute('aria-label',rtl?'ספר סקירת LINK בעברית. לחצו לפתיחה או לדפדוף.':'English LINK research book. Click to open or turn pages.');document.getElementById('hint').textContent=rtl?'לחצו על הכריכה לפתיחה. לחיצה בצד שמאל מקדמת, ובצד ימין חוזרת. במובייל אפשר גם להחליק.':'Click the cover to open. Click the right side to turn forward, or the left side to go back. You can also swipe on mobile.';
for(let i=1;i<=pageCount;i++){const article=document.createElement('article');article.className='page';if(i===1||i===pageCount)article.dataset.density='hard';const sheet=document.createElement('div');sheet.className='sheet';const image=new Image();image.src='assets/link-'+lang+'/'+String(i).padStart(2,'0')+'.webp';image.alt=i===pageCount?(rtl?'סוף':'The End'):(rtl?'עמוד '+i+' מתוך סקירת LINK':'LINK report page '+i);image.draggable=false;sheet.append(image);article.append(sheet);book.append(article)}
const flip=new St.PageFlip(book,{width:420,height:296.8,size:'stretch',minWidth:240,maxWidth:420,minHeight:169.6,maxHeight:297,showCover:true,usePortrait:true,autoSize:true,drawShadow:true,maxShadowOpacity:.28,flippingTime:matchMedia('(prefers-reduced-motion: reduce)').matches?1:700,useMouseEvents:false,mobileScrollSupport:true});flip.loadFromHTML(document.querySelectorAll('.page'));
function atEnd(){return flip.getCurrentPageIndex()>=(flip.getOrientation()==='landscape'?pageCount-2:pageCount-1)}
function update(){const n=flip.getCurrentPageIndex();frame.style.setProperty('--cover-shift',(flip.getOrientation()==='landscape'?book.getBoundingClientRect().width/4:0)+'px');frame.classList.toggle('front',n===0);status.textContent=n===0?(rtl?'כריכה קדמית':'Front cover'):atEnd()?(rtl?'סוף':'The End'):(rtl?'עמוד '+(n+1)+' מתוך '+reportPages:'Page '+(n+1)+' of '+reportPages)}
flip.on('flip',update);flip.on('changeOrientation',()=>requestAnimationFrame(update));addEventListener('resize',()=>requestAnimationFrame(update));update();let start;
book.addEventListener('pointerdown',e=>start={x:e.clientX,y:e.clientY});book.addEventListener('pointercancel',()=>start=null);book.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dy)>Math.max(25,Math.abs(dx)))return;if(Math.abs(dx)>30){if((rtl&&dx>0)||(!rtl&&dx<0))flip.flipNext();else flip.flipPrev();return}if(flip.getCurrentPageIndex()===0){flip.flipNext();return}if(atEnd()){flip.flipPrev();return}const r=book.getBoundingClientRect(),left=e.clientX<r.left+r.width/2;if((rtl&&left)||(!rtl&&!left))flip.flipNext();else flip.flipPrev()});
book.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();if((rtl&&e.key==='ArrowLeft')||(!rtl&&e.key==='ArrowRight'))flip.flipNext();else flip.flipPrev()}if(e.key==='Home'){e.preventDefault();flip.turnToPage(0);update()}if(e.key==='End'){e.preventDefault();flip.turnToPage(pageCount-1);update()}if(e.key==='Enter'||e.key===' '){e.preventDefault();if(atEnd())flip.flipPrev();else flip.flipNext()}});window.demoBook=flip;
function reportHeight(){parent.postMessage({type:'shmilapps-link-book-height',height:Math.ceil(document.body.getBoundingClientRect().height)+2},location.origin)}new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.body);addEventListener('load',reportHeight);flip.on('flip',reportHeight);
</script></body></html>
